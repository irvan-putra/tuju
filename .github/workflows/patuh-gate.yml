name: patuh consistency gate

# Family consistency checks from irvan-putra/patuh, required for tuju.
# On every push: source gate on the exact pushed tree. A manual dispatch
# also builds a debug APK and byte-checks the packaged icon pre-publish,
# and verifies the currently live release (post-publish mode).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gate:
    uses: irvan-putra/patuh/.github/workflows/release-gate.yml@b3c5d671164812ea06fb44857b0f0a423ade0d66
    with:
      app: tuju
      published: false

  build-debug-apk:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew && ./gradlew --no-daemon assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 1

  candidate-bytes-gate:
    if: github.event_name == 'workflow_dispatch'
    needs: build-debug-apk
    uses: irvan-putra/patuh/.github/workflows/release-gate.yml@b3c5d671164812ea06fb44857b0f0a423ade0d66
    with:
      app: tuju
      published: false
      candidate_apk_artifact: debug-apk

  verify-live-release:
    if: github.event_name == 'workflow_dispatch'
    uses: irvan-putra/patuh/.github/workflows/release-gate.yml@b3c5d671164812ea06fb44857b0f0a423ade0d66
    with:
      app: tuju
      published: true
