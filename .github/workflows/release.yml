name: tuju signed release

# Manual only. Builds the release APK, signs it with the tuju key from repository secrets,
# verifies the signature and package, then publishes a GitHub pre-release with a direct APK link.
on:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: android

jobs:
  consistency:
    # patuh pre-publish source gate: package, version format, label,
    # permission/license drift, family icon geometry, badge reads the
    # candidate version. A failure stops the release before anything builds.
    uses: irvan-putra/patuh/.github/workflows/release-gate.yml@3d9be2e1d971e3f9e3f748a2fb04931951e9f974
    with:
      app: tuju
      published: false

  release:
    needs: consistency
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.v.outputs.version }}
    env:
      EXPECTED_CERT_SHA256: "0A53B9A50A4487772E138F6FE24591FACAE97A5D6DDA97D31E8370B8DD0A2CB4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Map asset and journey meter are in sync with index.html
        run: python3 ../tools/test_route_map.py && python3 ../tools/test_journey_meter.py && python3 ../tools/build_journey_data.py --check && python3 tools/build_map_asset.py --check
      - run: chmod +x ./gradlew
      - name: Read version
        id: v
        run: |
          VER=$(sed -n 's/^val appVersionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          test -n "$VER"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build and sign
        env:
          TUJU_KEYSTORE_B64: ${{ secrets.TUJU_KEYSTORE_B64 }}
          TUJU_STORE_PASSWORD: ${{ secrets.TUJU_STORE_PASSWORD }}
          TUJU_KEY_ALIAS: ${{ secrets.TUJU_KEY_ALIAS }}
          TUJU_KEY_PASSWORD: ${{ secrets.TUJU_KEY_PASSWORD }}
        run: |
          echo "$TUJU_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/tuju.jks"
          export TUJU_KEYSTORE_FILE="$RUNNER_TEMP/tuju.jks"
          ./gradlew --no-daemon assembleRelease
          rm -f "$RUNNER_TEMP/tuju.jks"
      - name: Verify signature, package and permissions
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ steps.v.outputs.version }}"
          APK="app/build/outputs/apk/release/tuju-v${VER}-release.apk"
          test -f "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/cert.txt
          GOT=$(grep -m1 'certificate SHA-256 digest' /tmp/cert.txt | awk '{print toupper($NF)}')
          test "$GOT" = "$EXPECTED_CERT_SHA256"
          if "$BT/apksigner" verify --print-certs "$APK" | grep -q 'DEBUG'; then exit 1; fi
          # Permission allowlist: only the journey meter's runtime location
          # access is acceptable. Anything else (notably INTERNET) fails.
          PERMS=$("$BT/aapt" dump permissions "$APK" | sed -n "s/.*name='\([^']*\)'.*/\1/p" | sort -u)
          EXPECTED=$(printf 'android.permission.ACCESS_COARSE_LOCATION\nandroid.permission.ACCESS_FINE_LOCATION')
          if [ "$PERMS" != "$EXPECTED" ]; then echo "unexpected permissions:"; echo "$PERMS"; exit 1; fi
          cp "$APK" "tuju-v${VER}.apk"
          sha256sum "tuju-v${VER}.apk" | tee "tuju-v${VER}.apk.sha256"
      - name: Upload candidate APK for the byte check
        uses: actions/upload-artifact@v4
        with:
          name: candidate-apk
          path: |
            android/tuju-v${{ steps.v.outputs.version }}.apk
            android/tuju-v${{ steps.v.outputs.version }}.apk.sha256
          retention-days: 1

  candidate-bytes:
    # patuh checks the built APK's actual bytes (packaged icon badge) before
    # anything is published. This is the preventive boundary.
    needs: release
    uses: irvan-putra/patuh/.github/workflows/release-gate.yml@3d9be2e1d971e3f9e3f748a2fb04931951e9f974
    with:
      app: tuju
      published: false
      candidate_apk_artifact: candidate-apk

  publish:
    needs: [candidate-bytes, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_CERT_SHA256: "0A53B9A50A4487772E138F6FE24591FACAE97A5D6DDA97D31E8370B8DD0A2CB4"
    steps:
      - uses: actions/download-artifact@v4
        # run steps here default to working-directory android/, so land the
        # artifact where those steps look
        with: { name: candidate-apk, path: android/dist }
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          # no checkout in this job: gh needs explicit repository context
          GH_REPO: ${{ github.repository }}
        run: |
          VER="${{ needs.release.outputs.version }}"
          cp "dist/tuju-v${VER}.apk" "dist/tuju-v${VER}.apk.sha256" .
          cat > notes.md <<NOTES
          tuju ${VER}: the combined busway-route overview map from https://vanipy.com/tuju/ as an offline app screen - pinch to zoom, drag to pan, nothing else. Map bundled in the app; no network. Signed with the tuju key (certificate SHA-256 ${EXPECTED_CERT_SHA256}).

          0.2.24 adds Autograph Tower (Thamrin Nine / Academy @ UC) and Centennial Tower to the combined map and offline readable route notes, with separate outbound / return walks. The Tosari and Denpasar direction stops are kept distinct. Maps walking estimates, stairs, restricted access, Cawang interchange and service limits remain visible. No personal event schedule is included.

          0.2.23 adds a J.CO Reserve (AI Hotel Thamrin) destination pin at Tosari: out via 4C to Tosari 3 (~700 m walk), home from Tosari 2 (~200 m), with dashed walk links forking off the Grand Indonesia stubs into a shared trunk.

          0.2.22 recomputes the one-go review loop for public transit instead of driving: Google Maps transit directions with a fewer-transfers preference, every stop order checked on transit time, and the fewest-transfer order published (5 transfers, about 9 hours in transit) with per-leg routes and transfer counts.

          0.2.21 adds the one-go review loop to the walk-review screen: the nine physical stops (the twelve items collapse in Alam Sutera) in the shortest round-trip order from the Pramuka start, with per-leg and total road distance/time labeled as estimates.

          0.2.20 groups the walk-review checklist by route with filter chips and sorts it nearest-first from the Pramuka home start, with a straight-line distance on each item. Answers and the copy-back format are unchanged, and the screen stays fully offline in the app.

          0.2.19 adds the walk-review screen: a second offline page listing everything the map still marks unverified (the BINUS / Mall Alam Sutera crossing, sidewalks, gates and stops, the Senayan S61 access, and standing items elsewhere), each with a Confirmed / Not there / Partly status and a note field, and a Review text button that copies the results in the same copy-back format as the layout editor. The map itself is unchanged from 0.2.18 plus the day's user-feedback fixes: the de-tangled Pasar Rumput-Halimun-Galunggung cluster, 5M shared stops as rings, the straightened 5M join at Megaria with its transfer note, grounded BINUS walk links, and the Kuningan Madya ring connection.

          0.2.18 applies another round of Irvan's layout feedback. The two 5M direction columns now sit side by side like the S11 and S16 pairs, with the Bakoel Koffie note reconnected to both its stops (Farmasi RP Soeroso out, Kantor Pos Cikini home). The S61 block at Bundaran Senayan sits beside the network with a widened pair and straight walk links, and its header notes are re-broken into three lines and reordered so they stay clear of the Ragunan destination pin. The Kayu Putih Rawasari terminus headers and notes get their space back, and the Gojek walk link and bridge labels no longer cross stop labels. Stops, routes and access caveats are unchanged.

          0.2.17 applies three placements from Irvan's layout feedback: the Bakoel Koffie destination and its notes now sit between the two 5M columns with shorter walk links, the Grand Indonesia destination and notes sit beside Tosari with shorter walk links (the outbound link hops the return line), and the whole Alam Sutera S61 block sits under the Bundaran Senayan lines with its walk links re-anchored and its headers kept clear of them. Stops, routes and access caveats are unchanged.

          0.2.16 gives the 7F branch a clear arc over the 9/10 return line and the Matraman 3 link a clear arc over the 4C outbound line, so neither reads as a join. The Cawang Sentral note now says the 10 and 9 outbound platforms have different GTFS platform IDs and that the paid-area interchange is not verified, replacing the older same-halte claim.

          0.2.15 draws the Central Park 9 and 10 columns as two close parallel direction lines too: outbound on the right, the return on the left from GTFS trips 9-R02 and 10-R02 with their own stop names and order and no pairing. The two Cawang Sentral stops on the return are shown separately, with the interchange between them marked unverified. The 7F branch now leaves in a gap between labels, and the S61 outbound link clears its label.

          0.2.14 fixes two findings on 0.2.13: the 5M branch now hops cleanly over the 4C homebound line, and the shared 4C and 5M middle line has its own stop markers and direction arrows. The 6 stop labels beside the 4D return line now sit clear of it.

          0.2.13 draws red 4C and purple 5M as two close parallel direction lines too: outbound on the left with labels outside left, homebound on the right with labels outside right, and the shared 4C and 5M section as a middle line. Each direction keeps its own stop order, with no stop pairing by distance. Existing walks and links are kept.

          0.2.12 draws S11 and S61 as two close parallel direction lines, each with its own stop markers and labels outside, after rider feedback that one shared circle implied the opposite-direction stops are the same boarding point. Each direction keeps its own stop order. The Central Park walk now splits into a walk to the outbound boarding stop and a walk home from the return stop. The map is shorter again.

          0.2.11 draws S11 and S61 stops on one row only when they are the same named station on opposite sides (for example Warung Mangga 1 and 2). Differently named stops now keep their own rows, because distance alone does not show they share a boarding point. The map is about 500 units taller.

          0.2.10 moves the 4D return line and the Halimun and 4-to-6 notes so no route line crosses a station label around Galunggung, Setiabudi Integritas and Kuningan Madya.

          0.2.9 tightens the map layout: S11 and S61 move into the empty left and lower areas (map is about 22% shorter), crossing hops drop from 9 to 3, walking links and notes keep clear of text, S11 and S61 out and return stops share one spine matched by GTFS coordinates, and corridor 9 / 10 gains a return leg from GTFS trips 9-R02 and 10-R02. Option A and B notes sit beside the stations they describe.

          0.2.8 widens the spacing between parallel lines on the combined map, after rider feedback that same-color parallels and dotted walking links beside route lines were hard to tell apart: the 7A overlay no longer merges with the 7E return column, the 5M shared section sits visibly beside the red 4C spine, the Grand Indonesia walking links move further off both red spines, the S61 and Central Park walking connectors get their own corridors clear of the route columns, the 4D return line steps off the corridor 6 spine, and the Flyover direction-switch walk starts clear of the 7E column. Route colors, stops, joins, the enlarged notes, portrait layout, journey meter and optional GPS are unchanged. Icon badge reads 0.2.8. Physical-phone installation and real GPS remain unverified.

          0.2.7 enlarges the central map annotations, moves walking connectors clear of the notes, and adds schematic line hops at nonconnecting crossings. The same walking and return notes are also available as normal 16 px text without zoom on the web and in the offline app. Actual transfers keep their station joins. The portrait layout, straight red 4C spines, purple 5M branches, all destinations, directional stops, journey meter and optional GPS remain. Icon badge reads 0.2.7. Physical-phone installation and real GPS remain unverified.

          0.2.6 makes the combined map portrait, stacking S11 and S61 below the earlier network. Both red 4C directions are straight spines; purple 5M branches from SMPN 8 and rejoins at Megaria, with the same stop sequences. New BINUS Alam Sutera main-building and mall-extension markers have separate walking connections. Ride 4C to Bundaran Senayan 1, walk to the BRT halte, then S61 toward Alam Sutera to Forest Park. Return S61 boards at the different Mall stop toward Blok M, with a separate walk to Bundaran Senayan 2 for 4C toward JIEP. The main building and mall extension are parts of the same BINUS Alam Sutera operation in different buildings, not separate universities. Walking estimates vary by entrance: main building about 580 m out / 620 m home; extension Maps pin about 1.0 km out / 790 m home. Pedestrian conditions, crossings and gate access remain unverified on site. Every prior destination, directional intermediate stop, journey meter and optional GPS is retained. Icon badge reads 0.2.6. Physical-phone installation and real GPS remain unverified.

          0.2.5 adds The Breeze BSD via S11 from Central Park and direct 4C to Grand Indonesia, including independently sourced returns and intermediate stops on the same connected map. S11 ends at Serpong BSD: The Breeze needs a substantial 2.2 km / 29 min final walk, whose pedestrian conditions remain unverified on site. The 4C return rejoins the existing Megaria homebound spine. The map is wider to preserve readable labels at zoom. Journey meter adds the new selected legs; existing optional GPS behavior and permissions are unchanged. Icon badge reads 0.2.5. Physical-phone installation remains unverified.

          0.2.0 adds the journey meter below the map: start/stop ride timer with start and end stop selection per leg, plus optional GPS distance - off by default, the location permission is asked only when you switch GPS on, tracking runs only while the screen is open, and everything stays on the device. New: script enabled for the meter, ACCESS_FINE_LOCATION/ACCESS_COARSE_LOCATION declared (runtime-asked, optional features).

          0.2.1 grounds the comparison in operator data: straight-line stop-to-stop distance from official GTFS stop coordinates (feed of 21 Nov 2026) and scheduled minutes from the referenced timetable trips for the outbound legs. Return legs and 4D have no referenced trip, so they report distance only where coordinates match, and nothing is invented - uncovered figures say not measured. Emulator checks: meter DOM journey run, GPS toggle and a meter screenshot, on top of map fit/pinch/pan. Real GPS fixes and a physical Samsung remain untested.

          0.2.2 adds the official IDSW 2026 access guideline (idsw.dev/access-guideline, checked 21 Nov 2026) below the meter: the Sunday 22 Nov Car Free Day window and its registration impact, nearest LRT / Transjakarta Rasuna Said stops, the final JPO walk, ride-hailing pins, parking advice and e-money / peak-hour tips. The source link is kept as plain text; the app stays offline with no network permission. Map, journey meter and GPS behavior unchanged.

          0.2.4 adds Bakoel Koffie (Cikini, Menteng) as a fifth destination: the combined map marks the Farmasi RP Soeroso alighting stop on the existing 5M leg with the venue and its ~100 m walk, and the page gains the venue card, the one-transfer ride there (4C to Tugu Proklamasi, 5M via Cikini to Farmasi RP Soeroso) and the one-transfer ride home (5M from Kantor Pos Cikini to Megaria, 4C to Pramuka BPKP 1), all from the operator GTFS feed checked 22 Nov 2026. Route geometry elsewhere, journey meter and GPS behavior unchanged.

          0.2.3 draws the official venue access into the combined map itself, at the 4D Rasuna Said terminus: the LRT Rasuna Said marker sharing the same JPO walk, the official final walk into the Gedung PPHUI complex, and the Sunday 22 Nov Car Free Day window (no car/motorbike gate drop-off 05:30-09:00; LRT + 6/6A keep running). Route geometry, journey meter and GPS behavior unchanged.

          Shows every intermediate stop on the selected outbound routes (4 via Saharjo, 6, 7E toward Kampung Rambutan, 10, 9 toward Pluit, 4C and 5M via Cikini), sourced from the TransJakarta operator GTFS checked 18 November 2026. The earlier 0.1.4 adds the 4D branch to Rasuna Said (Plaza Festival), drawn as a branch off the shared first ten stops of corridor 4; the 4D stop list is from jaGOdetabek and halte.id, not GTFS. Route patterns and temporary stops may change; this is not live arrival information. Paid-area/fare uncertainties remain visible.

          0.1.5 embeds both Arkadia homebound options in the offline map: Arkadia-side 7E to Ragunan, 6 to Galunggung, 4 to Simpang Pramuka 1; or opposite-side Gojek to Flyover Raya Bogor, 7F to Kayu Putih Rawasari. Actual directional stop sequences are from Catenary GTFS rendering; terminal access/fare continuity, 7F hours and ride times remain caveated.

          0.1.6 integrates those return choices into the top network itself, with northbound arrows and transfer links. No separate lower homebound panel. All directional stop lists and service/fare caveats remain.

          0.1.7 merges the shared outbound/homebound 4 and 6 station areas into a single two-way spine. Only the different 4 approach and Flyover Kuningan branch locally; the distinct roadside 7E stops and all access/fare/service caveats stay visible.

          0.1.8 moves the Gojek / 7F homebound option to the far left, beside the venue-side 7E return column. Same stops, directions and caveats; the Gojek hop is drawn as a separate dashed link below the network.

          0.1.9 merges the shared 10 outbound and 7F homebound station areas (Kayu Putih Rawasari, Pemuda Pramuka, Utan Kayu Rawamangun) into one two-way spine, like the 4 / 6 spine: only the different stops branch, 10 toward Cawang Sentral and 7F toward Flyover Raya Bogor. 7F order per Catenary's GTFS rendering (18 Nov 2026), cross-checked with an e-kompas route listing. The launcher icon version badge now matches the release (0.1.8 still showed 0.1.7). All service, access and fare caveats stay visible.

          Pixel 6 / API 34 emulator checks cover map fit, actual pinch zoom and dragging. Not tested on a physical Samsung. Same package and pinned signing certificate as 0.1.0; intended as an in-place update.

          SHA-256 of the APK is in the attached .sha256 file.
          NOTES
          gh release create "v${VER}" "tuju-v${VER}.apk" "tuju-v${VER}.apk.sha256" \
            --title "tuju ${VER}" --notes-file notes.md --prerelease --target "${GITHUB_SHA}"

  verify:
    # post-publish: verifies the live release (tag, APK name, checksum,
    # gallery card, downloaded sha256, packaged icon). Detects, cannot undo.
    needs: publish
    uses: irvan-putra/patuh/.github/workflows/release-gate.yml@3d9be2e1d971e3f9e3f748a2fb04931951e9f974
    with:
      app: tuju
      published: true
