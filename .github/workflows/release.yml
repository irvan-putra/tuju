name: tuju signed release

# Manual only. Builds the release APK, signs it with the tuju key from repository secrets,
# verifies the signature and package, then publishes a GitHub pre-release with a direct APK link.
on:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: android

jobs:
  consistency:
    # patuh pre-publish source gate: package, version format, label,
    # permission/license drift, family icon geometry, badge reads the
    # candidate version. A failure stops the release before anything builds.
    uses: irvan-putra/patuh/.github/workflows/release-gate.yml@6f4b1eec2a8f73348725b7e3698d3e7bca93b890
    with:
      app: tuju
      published: false

  release:
    needs: consistency
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.v.outputs.version }}
    env:
      EXPECTED_CERT_SHA256: "0A53B9A50A4487772E138F6FE24591FACAE97A5D6DDA97D31E8370B8DD0A2CB4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Map asset is in sync with index.html
        run: python3 ../tools/test_route_map.py && python3 tools/build_map_asset.py --check
      - run: chmod +x ./gradlew
      - name: Read version
        id: v
        run: |
          VER=$(sed -n 's/^val appVersionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          test -n "$VER"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build and sign
        env:
          TUJU_KEYSTORE_B64: ${{ secrets.TUJU_KEYSTORE_B64 }}
          TUJU_STORE_PASSWORD: ${{ secrets.TUJU_STORE_PASSWORD }}
          TUJU_KEY_ALIAS: ${{ secrets.TUJU_KEY_ALIAS }}
          TUJU_KEY_PASSWORD: ${{ secrets.TUJU_KEY_PASSWORD }}
        run: |
          echo "$TUJU_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/tuju.jks"
          export TUJU_KEYSTORE_FILE="$RUNNER_TEMP/tuju.jks"
          ./gradlew --no-daemon assembleRelease
          rm -f "$RUNNER_TEMP/tuju.jks"
      - name: Verify signature, package and permissions
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ steps.v.outputs.version }}"
          APK="app/build/outputs/apk/release/tuju-v${VER}-release.apk"
          test -f "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/cert.txt
          GOT=$(grep -m1 'certificate SHA-256 digest' /tmp/cert.txt | awk '{print toupper($NF)}')
          test "$GOT" = "$EXPECTED_CERT_SHA256"
          if "$BT/apksigner" verify --print-certs "$APK" | grep -q 'DEBUG'; then exit 1; fi
          if "$BT/aapt" dump permissions "$APK" | grep -q 'uses-permission'; then exit 1; fi
          cp "$APK" "tuju-v${VER}.apk"
          sha256sum "tuju-v${VER}.apk" | tee "tuju-v${VER}.apk.sha256"
      - name: Upload candidate APK for the byte check
        uses: actions/upload-artifact@v4
        with:
          name: candidate-apk
          path: |
            android/tuju-v${{ steps.v.outputs.version }}.apk
            android/tuju-v${{ steps.v.outputs.version }}.apk.sha256
          retention-days: 1

  candidate-bytes:
    # patuh checks the built APK's actual bytes (packaged icon badge) before
    # anything is published. This is the preventive boundary.
    needs: release
    uses: irvan-putra/patuh/.github/workflows/release-gate.yml@6f4b1eec2a8f73348725b7e3698d3e7bca93b890
    with:
      app: tuju
      published: false
      candidate_apk_artifact: candidate-apk

  publish:
    needs: [candidate-bytes, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_CERT_SHA256: "0A53B9A50A4487772E138F6FE24591FACAE97A5D6DDA97D31E8370B8DD0A2CB4"
    steps:
      - uses: actions/download-artifact@v4
        # run steps here default to working-directory android/, so land the
        # artifact where those steps look
        with: { name: candidate-apk, path: android/dist }
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ needs.release.outputs.version }}"
          cp "dist/tuju-v${VER}.apk" "dist/tuju-v${VER}.apk.sha256" .
          cat > notes.md <<NOTES
          tuju ${VER}: the combined busway-route overview map from https://vanipy.com/tuju/ as an offline app screen - pinch to zoom, drag to pan, nothing else. Map bundled in the app; no network, no permissions. Signed with the tuju key (certificate SHA-256 ${EXPECTED_CERT_SHA256}).

          Shows every intermediate stop on the selected outbound routes (4 via Saharjo, 6, 7E toward Kampung Rambutan, 10, 9 toward Pluit, 4C and 5M via Cikini), sourced from the TransJakarta operator GTFS checked 18 November 2026. The earlier 0.1.4 adds the 4D branch to Rasuna Said (Plaza Festival), drawn as a branch off the shared first ten stops of corridor 4; the 4D stop list is from jaGOdetabek and halte.id, not GTFS. Route patterns and temporary stops may change; this is not live arrival information. Paid-area/fare uncertainties remain visible.

          0.1.5 embeds both Arkadia homebound options in the offline map: Arkadia-side 7E to Ragunan, 6 to Galunggung, 4 to Simpang Pramuka 1; or opposite-side Gojek to Flyover Raya Bogor, 7F to Kayu Putih Rawasari. Actual directional stop sequences are from Catenary GTFS rendering; terminal access/fare continuity, 7F hours and ride times remain caveated.

          0.1.6 integrates those return choices into the top network itself, with northbound arrows and transfer links. No separate lower homebound panel. All directional stop lists and service/fare caveats remain.

          0.1.7 merges the shared outbound/homebound 4 and 6 station areas into a single two-way spine. Only the different 4 approach and Flyover Kuningan branch locally; the distinct roadside 7E stops and all access/fare/service caveats stay visible.

          0.1.8 moves the Gojek / 7F homebound option to the far left, beside the venue-side 7E return column. Same stops, directions and caveats; the Gojek hop is drawn as a separate dashed link below the network.

          0.1.9 merges the shared 10 outbound and 7F homebound station areas (Kayu Putih Rawasari, Pemuda Pramuka, Utan Kayu Rawamangun) into one two-way spine, like the 4 / 6 spine: only the different stops branch, 10 toward Cawang Sentral and 7F toward Flyover Raya Bogor. 7F order per Catenary's GTFS rendering (18 Nov 2026), cross-checked with an e-kompas route listing. The launcher icon version badge now matches the release (0.1.8 still showed 0.1.7). All service, access and fare caveats stay visible.

          Pixel 6 / API 34 emulator checks cover map fit, actual pinch zoom and dragging. Not tested on a physical Samsung. Same package and pinned signing certificate as 0.1.0; intended as an in-place update.

          SHA-256 of the APK is in the attached .sha256 file.
          NOTES
          gh release create "v${VER}" "tuju-v${VER}.apk" "tuju-v${VER}.apk.sha256" \
            --title "tuju ${VER}" --notes-file notes.md --prerelease --target "${GITHUB_SHA}"

  verify:
    # post-publish: verifies the live release (tag, APK name, checksum,
    # gallery card, downloaded sha256, packaged icon). Detects, cannot undo.
    needs: publish
    uses: irvan-putra/patuh/.github/workflows/release-gate.yml@6f4b1eec2a8f73348725b7e3698d3e7bca93b890
    with:
      app: tuju
      published: true
