<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tuju walk review - what to verify on the ground</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0 auto; max-width: 44rem; padding: 1.5rem 1rem 6rem; line-height: 1.55; }
  h1 { font-size: 1.6rem; margin-bottom: .2rem; }
  h2 { font-size: 1.15rem; margin-top: 2rem; border-bottom: 1px solid #8884; padding-bottom: .25rem; }
  .sub { opacity: .75; margin-top: 0; }
  .card { border: 1px solid #8884; border-radius: .75rem; padding: 1rem 1.1rem; margin: 1rem 0; }
  .card h3 { margin: 0 0 .4rem; font-size: 1.02rem; }
  .note { font-size: .85rem; opacity: .8; }
  a { color: #4a7ddb; }
  .item { border: 1px solid #8884; border-radius: .75rem; padding: .8rem 1rem; margin: .8rem 0; }
  .item h3 { margin: 0 0 .25rem; font-size: .98rem; }
  .item p { margin: .3rem 0 .5rem; font-size: .9rem; opacity: .85; }
  .item .states { display: flex; flex-wrap: wrap; gap: 6px; }
  .item button { font: inherit; font-size: .85rem; padding: 5px 12px; border: 1px solid #8886; border-radius: 999px; background: Canvas; color: CanvasText; }
  .item button.on { background: #2e9e50; border-color: #2e9e50; color: #fff; }
  .item button.on.no { background: #c52d36; border-color: #c52d36; }
  .item button.on.partly { background: #b87e1e; border-color: #b87e1e; }
  .item input { font: inherit; font-size: .88rem; width: 100%; margin-top: .5rem; padding: 6px 9px; border: 1px solid #8886; border-radius: .5rem; background: Canvas; color: CanvasText; }
  #review-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; font: 14px/1.4 system-ui, sans-serif; }
  #review-bar .bar { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-items: center; padding: 8px; background: Canvas; border-top: 1px solid #8885; }
  #review-bar button { font: inherit; padding: 6px 12px; border: 1px solid #8886; border-radius: 999px; background: Canvas; color: CanvasText; }
  #review-bar button.on { background: #4a7ddb; color: #fff; border-color: #4a7ddb; }
  #review-panel { display: none; max-width: 44rem; margin: 8px auto 0; padding: 10px; background: Canvas; border: 1px solid #8885; border-radius: 8px; }
  #review-panel.open { display: block; }
  #review-panel pre { white-space: pre-wrap; max-height: 12rem; overflow: auto; margin: 6px 0; font-size: .85rem; }
</style>
</head>
<body data-version="0.2.19">
<h1>tuju walk review</h1>
<p class="sub"><a href="../index.html" id="back-link">&larr; tuju map</a> · Things the map marks unverified, as an on-the-ground checklist. Tap a status per item, add a note if useful, then copy the result text and send it back.</p>

<div id="groups"></div>

<div id="review-bar">
 <div id="review-panel">
  <div>Copy this and send it with your findings:</div>
  <pre id="review-text"></pre>
  <button type="button" data-act="copy">Copy results</button>
  <button type="button" data-act="close-panel">Close</button>
 </div>
 <div class="bar">
  <button type="button" data-act="panel">Review text</button>
  <button type="button" data-act="reset">Reset</button>
  <span id="review-count"></span>
 </div>
</div>

<script>
(function(){
"use strict";
var GROUPS=[
 {title:'BINUS / Mall Alam Sutera walk',items:[
  {id:'binus-crossing',q:'Crossing between the BINUS main building (Kav. 21) and Mall Alam Sutera over Jl. Jalur Sutera Barat',d:'Satellite shows no formal crossing at the closest point; BINUS claims a 5-10 min walk across. Is there a zebra/pelican crossing or a usable informal crossing near the T-junction?'},
  {id:'binus-sidewalks',q:'Sidewalks: Forest Park stop to BINUS main, and Forest Park to the mall East Side',d:'Map says ~0.8 km / 11 min and ~0.4 km / 5 min (Google walking). Are the sidewalks continuous and actually walkable?'},
  {id:'binus-gates',q:'BINUS campus pedestrian gate from the Forest Park / mall side',d:'Which gate is open to pedestrians, and does entering need anything (card, security desk)?'},
  {id:'suteraloop-stop',q:'SuteraLoop free shuttle: campus stop and mall stop',d:'Moovit lists a 24-stop loop from Mall @ Alam Sutera; campus coverage unverified. Does it stop at/near the campus? Where exactly is the mall stop?'},
  {id:'s61-mall-stop',q:'S61 "Mall" stop (toward Blok M): exact position',d:'Estimated ~0.5 km / 6 min from the mall East Side, position unverified. Which street and side, and is it a shelter or a curbside pole?'},
  {id:'s61-forest-park',q:'S61 Forest Park stop (terminus): BRT shelter or curbside?',d:'Gate and tap-in reality for boarding toward Blok M.'}
 ]},
 {title:'Bundaran Senayan (S61 start)',items:[
  {id:'senayan-access',q:'4C curbside to S61 BRT at Bundaran Senayan: pedestrian access',d:'Map says not an in-platform change. Check the overpass/access, gates and platform, and whether a fresh tap/fare applies.'}
 ]},
 {title:'Elsewhere, when nearby',items:[
  {id:'central-park-crossing',q:'Central Park mall to the 9 up stop (Tanjung Duren Arah Timur): road crossing',d:'Map says ~100 m from the Arah Barat stop; the crossing from the mall is unverified.'},
  {id:'gi-tosari-crossing',q:'Grand Indonesia home walk to Tosari 2: crossing',d:'Map note says "check crossing" for the home direction.'},
  {id:'ragunan-access',q:'7E to corridor 6 at Department of Agriculture / Simpang Ragunan Ar-Raudhah: gate and fare',d:'Gate access and fare continuity between 7E and corridor 6 are unverified.'},
  {id:'7f-access',q:'7F pickup at Flyover Raya Bogor: boarding access and service hours',d:'Service-hour listings disagree (jaGOdetabek, Moovit, Traveloka). What do the posted signs say, and is boarding access straightforward?'},
  {id:'s11-breeze-path',q:'S11 Serpong BSD terminus to The Breeze BSD: the 2.2 km path',d:'Map says ~29 min via BSD Grand Boulevard, pedestrian path not checked. Sidewalks and crossings OK the whole way?'}
 ]}
];
var KEY='tuju-walk-review-v1';
var state={};
try{state=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){state={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function version(){return document.body.getAttribute('data-version')||'0.2.18'}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function render(){
 var host=document.getElementById('groups');host.innerHTML='';
 GROUPS.forEach(function(g){
  var h=document.createElement('h2');h.textContent=g.title;host.appendChild(h);
  g.items.forEach(function(it){
   var st=state[it.id]||{};
   var d=document.createElement('div');d.className='item';d.dataset.id=it.id;
   d.innerHTML='<h3>'+esc(it.q)+'</h3><p>'+esc(it.d)+'</p>'+
    '<div class="states">'+
    '<button type="button" data-s="confirmed">Confirmed</button>'+
    '<button type="button" data-s="not-there">Not there</button>'+
    '<button type="button" data-s="partly">Partly / different</button>'+
    '</div>'+
    '<input type="text" placeholder="note (optional)" maxlength="200" value="'+esc(st.note||'')+'">';
   host.appendChild(d);
  });
 });
 refresh();
}
function refresh(){
 document.querySelectorAll('.item').forEach(function(d){
  var st=state[d.dataset.id]||{};
  d.querySelectorAll('button').forEach(function(b){
   var on=st.status===b.dataset.s;
   b.classList.toggle('on',on);
   b.classList.toggle('no',on&&b.dataset.s==='not-there');
   b.classList.toggle('partly',on&&b.dataset.s==='partly');
  });
 });
 var n=Object.keys(state).filter(function(k){return state[k]&&state[k].status}).length;
 var total=GROUPS.reduce(function(a,g){return a+g.items.length},0);
 document.getElementById('review-count').textContent=n+' of '+total+' checked';
 if(document.getElementById('review-panel').classList.contains('open'))document.getElementById('review-text').textContent=lines();
}
function lines(){
 var L=['Tuju walk review (map '+version()+')','On-ground verification results; one line per item.'];
 GROUPS.forEach(function(g){g.items.forEach(function(it){
  var st=state[it.id];if(!st||!st.status)return;
  var s='- ['+it.id+'] '+it.q+': '+st.status.toUpperCase();
  if(st.note)s+=' - "'+st.note.replace(/"/g,"'")+'"';
  L.push(s);
 })});
 if(L.length===2)L.push('(nothing checked yet)');
 return L.join('\n');
}
function flash(t){var s=document.getElementById('review-count');var old=s.textContent;s.textContent=t;setTimeout(refresh,1500)}
function copyText(){var t=lines();
 function fail(){var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');flash('Copied')}catch(e){flash('Select and copy the text above')}document.body.removeChild(ta)}
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){flash('Copied')},fail)}else fail()}
document.getElementById('groups').addEventListener('click',function(e){
 var b=e.target&&e.target.closest?e.target.closest('button[data-s]'):null;if(!b)return;
 var id=b.closest('.item').dataset.id;var st=state[id]||{};
 if(st.status===b.dataset.s){delete st.status}else{st.status=b.dataset.s}
 state[id]=st;save();refresh();
});
document.getElementById('groups').addEventListener('input',function(e){
 var inp=e.target&&e.target.closest?e.target.closest('.item input'):null;if(!inp)return;
 var id=inp.closest('.item').dataset.id;var st=state[id]||{};st.note=inp.value;state[id]=st;save();
});
document.getElementById('review-bar').addEventListener('click',function(e){
 var b=e.target&&e.target.closest?e.target.closest('button[data-act]'):null;if(!b)return;
 var act=b.dataset.act;
 if(act==='panel'){document.getElementById('review-panel').classList.add('open');document.getElementById('review-text').textContent=lines()}
 else if(act==='close-panel'){document.getElementById('review-panel').classList.remove('open')}
 else if(act==='copy'){copyText()}
 else if(act==='reset'){state={};save();document.querySelectorAll('.item input').forEach(function(i){i.value=''});refresh()}
});
document.getElementById('back-link').addEventListener('click',function(e){if(history.length>1){history.back();e.preventDefault()}});
render();
})();
</script>
</body>
</html>
